    <link rel="stylesheet" href="/node_modules/katex/dist/katex.min.css" />

    <script type="importmap">
      { "imports": {
        "react": "https://esm.sh/react@19.3.0",
        "react-dom/client": "https://esm.sh/react-dom@19.3.0/client"
      } }

  <body class="demo-page">
    <a class="skip-link" href="#main-content">Skip to content</a>
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="/"><span class="brand-mark"></span>Animath</a>
        <nav class="top-nav" aria-label="Site">
          <a href="/docs/">Docs</a>
          <a href="/">Core demo</a>
          <a href="/react.html" aria-current="page">React demo</a>
          <a href="/gallery.html">Examples</a>
        </nav>
      </div>
    </header>
    <main id="main-content">
      <span class="eyebrow">React adapter</span>
      <h1>Animath, driven by React.</h1>
      <p class="lead"><code>AnimathPlayer</code> owns the timeline while <code>AnimathCanvas</code> renders the scene — one state source, no double-ticking.</p>
      <div class="demo-frame" id="app"></div>
    </main>
    <footer class="footer"><a href="/docs/react.html">React documentation</a> · <a href="/docs/">All docs</a> · <a href="/gallery.html">Examples</a></footer>
    <script type="module">
      import React from 'react';
      import { createRoot } from 'react-dom/client';
      import { Circle, MathTex, Timeline, Tween, Vector2, easeInOutQuad } from '../dist/index.js';
      import { AnimathPlayer } from '../dist/react/index.js';

      const scene = new Circle(0).setStyle({ opacity: 0 }).moveTo(new Vector2(450, 260));
      const orb = new Circle(46).setStyle({ fill: '#c9973f', stroke: '#f0efe9', strokeWidth: 3 }).moveTo(new Vector2(-230, 40));
      const satellite = new Circle(16).setStyle({ fill: '#e8b874', stroke: '#f0efe9', strokeWidth: 2 }).moveTo(new Vector2(0, -100));
      const formula = new MathTex('f(x) = \\sin(x)', { fontSize: 34 }).setStyle({ fill: '#f0efe9' }).moveTo(new Vector2(-110, -180));
      scene.add(orb, satellite, formula);
      const timeline = new Timeline()
        .add(new Tween({ duration: 3, easing: easeInOutQuad, onUpdate: (progress) => {
          orb.moveTo(new Vector2(-230 + progress * 460, 40));
          satellite.moveTo(new Vector2(Math.cos(progress * Math.PI * 4) * 120, -100 + Math.sin(progress * Math.PI * 4) * 60));
        }}))
        .add(new Tween({ duration: 1, onUpdate: (progress) => formula.setStyle({ opacity: progress }) }));

      function App() {
        return React.createElement(AnimathPlayer, { scene, timeline, width: 860, height: 500, style: { width: '100%', height: 'auto' } });
      }
      createRoot(document.querySelector('#app')).render(React.createElement(App));
    </script>
  </body>
</html>
