<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Animath demo</title>
    <link rel="stylesheet" href="../node_modules/katex/dist/katex.min.css" />
    <style>
      :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0f172a; color: #e2e8f0; }
      main { width: min(920px, calc(100vw - 32px)); }
      h1 { margin-bottom: 8px; }
      p { color: #94a3b8; }
      svg { width: 100%; height: auto; display: block; border: 1px solid #334155; border-radius: 16px; background: radial-gradient(circle at center, #1e293b, #111827); }
      .controls { display: flex; gap: 12px; align-items: center; margin-top: 16px; }
      button { border: 0; border-radius: 8px; padding: 9px 14px; color: white; background: #2563eb; cursor: pointer; }
      button:hover { background: #3b82f6; }
      input { flex: 1; accent-color: #60a5fa; }
      code { color: #93c5fd; }
      .site-nav { display: flex; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
      .site-nav a { color: #93c5fd; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <nav class="site-nav"><a href="/">Core demo</a><a href="/react.html">React demo</a><a href="/gallery.html">Examples</a><a href="/docs/">Docs</a><a href="/docs/calculus.html">Calculus</a><a href="/docs/api.html">API</a></nav>
      <h1>Animath core demo</h1>
      <p>SVG rendering, hierarchical transforms, easing, and a seekable timeline in one small scene.</p>
      <svg id="stage" viewBox="0 0 900 520" aria-label="Animated circles"></svg>
      <div class="controls">
        <button id="play" type="button">Play</button>
        <button id="reset" type="button">Reset</button>
        <input id="scrubber" type="range" min="0" max="6" step="0.01" value="0" aria-label="Timeline position" />
        <span id="time">0.00s</span>
      </div>
      <p>Try dragging the scrubber. The source is <code>demo/index.html</code>.</p>
    </main>
    <script type="module">
      import { Circle, MathTex, SvgRenderer, Timeline, Tween, Vector2, easeInOutQuad } from '../dist/index.js';

      const svg = document.querySelector('#stage');
      const playButton = document.querySelector('#play');
      const resetButton = document.querySelector('#reset');
      const scrubber = document.querySelector('#scrubber');
      const timeLabel = document.querySelector('#time');
      const renderer = new SvgRenderer(svg);
      renderer.resize(900, 520);

      const scene = new Circle(0).setStyle({ opacity: 0 }).moveTo(new Vector2(450, 260));
      const blue = new Circle(42).setStyle({ fill: '#38bdf8', stroke: '#bae6fd', strokeWidth: 3 }).moveTo(new Vector2(-260, 0));
      const pink = new Circle(30).setStyle({ fill: '#f472b6', stroke: '#fbcfe8', strokeWidth: 3 }).moveTo(new Vector2(0, 0));
      const gold = new Circle(22).setStyle({ fill: '#facc15', stroke: '#fef08a', strokeWidth: 3 }).moveTo(new Vector2(0, 0));
      const formula = new MathTex('a^2 + b^2 = c^2', { fontSize: 32 }).setStyle({ fill: '#e2e8f0' }).moveTo(new Vector2(-145, -175));
      scene.add(blue, pink.add(gold), formula);

      const timeline = new Timeline()
        .add(new Tween({ duration: 2, easing: easeInOutQuad, onUpdate: (progress) => {
          blue.moveTo(new Vector2(-260 + progress * 520, 0));
          blue.rotate(0.08);
        }}))
        .add(new Tween({ duration: 2, easing: easeInOutQuad, onUpdate: (progress) => {
          pink.moveTo(new Vector2(0, progress * 130));
          pink.setScale(new Vector2(1 + progress * 0.5, 1 + progress * 0.5));
        }}))
        .add(new Tween({ duration: 2, easing: easeInOutQuad, onUpdate: (progress) => {
          gold.moveTo(new Vector2(Math.sin(progress * Math.PI * 2) * 130, -progress * 100));
          gold.setStyle({ opacity: 1 - progress * 0.7 });
        }}));

      function render() {
        renderer.beginFrame();
        renderer.renderMobject(scene);
        renderer.endFrame();
        scrubber.value = String(timeline.currentTime);
        timeLabel.textContent = `${timeline.currentTime.toFixed(2)}s`;
        playButton.textContent = timeline.status === 'playing' ? 'Pause' : 'Play';
      }

      playButton.addEventListener('click', () => {
        if (timeline.status === 'playing') timeline.pause();
        else timeline.play();
        render();
      });
      resetButton.addEventListener('click', () => { timeline.seek(0); render(); });
      scrubber.addEventListener('input', () => { timeline.seek(Number(scrubber.value)); render(); });

      let previous = performance.now();
      function frame(now) {
        const delta = (now - previous) / 1000;
        previous = now;
        if (timeline.status === 'playing') {
          timeline.tick(delta);
          render();
        }
        requestAnimationFrame(frame);
      }
      timeline.seek(0);
      render();
      requestAnimationFrame(frame);
    </script>
  </body>
</html>
